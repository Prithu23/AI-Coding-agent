<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMPTEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bitter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <aside class="sidebar">
    <div class="sidebar-dots">
      <span class="dot dot-mustard"></span>
      <span class="dot dot-teal"></span>
      <span class="dot dot-orange"></span>
    </div>
    <h2 class="sidebar-title">Prompts</h2>
    <div class="sidebar-list" id="prompt-history">
      <!-- history pills get inserted here by script.js -->
    </div>
  </aside>

  <main class="main">
    <h1 class="logo">Promptex</h1>

    <section class="output-panel" id="output-panel">
      <div class="output-tools">
        <button class="tool-btn" id="toggle-log" title="Debug log">🛠</button>
        <button class="tool-btn" id="toggle-push" title="Push to GitHub">⇪</button>
      </div>

      <pre class="output-code" id="output-code"><code>&lt;Start coding from here >:D&gt;</code></pre>

      <div class="drawer" id="log-drawer" hidden>
        <h3>Debug log</h3>
        <pre id="log-content"></pre>
      </div>

      <div class="drawer" id="push-drawer" hidden>
        <h3>Push to GitHub</h3>
        <input type="text" id="repo-url" placeholder="https://github.com/username/reponame.git">
        <input type="text" id="branch" placeholder="main" value="main">
        <button id="push-btn" class="btn-push">Push</button>
        <p id="push-status" class="push-status"></p>
      </div>
    </section>

    <form class="searchbar" id="searchbar">
      <input type="text" id="requirement" placeholder="Type in your prompt away :D" autocomplete="off">
      <button type="submit" class="search-btn" id="run-btn" title="Run">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
